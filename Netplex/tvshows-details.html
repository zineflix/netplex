     <!-- Loading Screen -->
     <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p class="loading-text">Loading...</p>
    </div>

    <div class="blurred-background"></div>
    
    <div class="container" id="main-content-container">
        <div class="details-page">
            
            <div id="iframe-container">
                <div class="video-controls-container">

                    <div class="season-episode-controls">
                        <div class="server-control">
                            <button id="season-dropdown-btn" tabindex="0">
                                Season <span id="current-season">1</span> <span class="dropdown-icon">&#9660;</span>
                            </button>
                            <div id="season-dropdown" class="server-dropdown">
                                <ul id="season-list"></ul>
                            </div>
                        </div>
                        <div class="server-control">
                            <button id="episode-dropdown-btn" tabindex="0">
                                Episode <span id="current-episode">1</span> <span class="dropdown-icon">&#9660;</span>
                            </button>
                            <div id="episode-dropdown" class="server-dropdown">
                                <ul id="episode-list"></ul>
                            </div>
                        </div>
                    </div>

                    <div class="server-control">
                        <button id="change-server-btn" tabindex="0">
                            Change Server <span class="dropdown-icon">&#9660;</span>
                        </button>
                        <div id="server-dropdown" class="server-dropdown">
                            <ul id="server-list"></ul>
                        </div>
                    </div>                  
                  
                    <button id="sandbox-toggle" class="sandbox-btn on" tabindex="0">Sandbox: ON</button>
                    <button onclick="toggleFullscreen()" tabindex="0">Fullscreen</button>
                    <button id="download-btn" class="download-btn" tabindex="0">Download</button>
                </div>

                <iframe id="tv-iframe" frameborder="0" allowfullscreen 
                    referrerpolicy="no-referrer" scrolling="no" 
                    sandbox="allow-scripts allow-presentation allow-same-origin">
                </iframe>
            </div>

            <div class="details-sidebar">
                
                <div class="poster-info-row">
                    
                    <div class="poster-container">
                        <img id="tv-poster" alt="TV Show Poster" class="details-poster" src="images/placeholder.png">
                        <button id="watch-trailer-btn" tabindex="0">Watch Trailer</button>
                    </div>       
                    
                    <div class="info-section">
                        <h1 id="tv-title">TV Show Title</h1>
                        <p id="tv-description">This is the TV show description...</p>
                        
                        <div class="details-genres" id="tv-genres"></div>

                        <div class="details-info">
                            <div class="details-rating" id="tv-rating"></div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-buttons"></div>         
                
                <div class="cast-container">
                    <h2>Cast</h2>
                    <div class="details-cast" id="tv-cast"></div>
                </div>    
            </div>
        </div>    
    </div>
    
    <div id="trailer-popup" class="trailer-popup">
        <div class="trailer-content">
            <button id="close-trailer" class="close-trailer" tabindex="0" aria-label="Close Trailer">&times;</button>
            <iframe id="tv-iframe-trailer" width="854" height="480" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>        
    
    <button class="close-button" id="close-button" tabindex="0">
        <span class="close-text">CLOSE</span>&times;
    </button>

<div id="sandbox-warning" class="sandbox-warning">

    <p>Turning Sandbox OFF will enabled ADS from the server.</p>
    <div class="warning-buttons">
      <button id="proceed-btn" tabindex="0">Proceed</button>

    </div>
  </div>
</div>
