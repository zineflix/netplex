        <div class="movie-details">
            
            <div id="iframe-container">

                <div class="video-controls-container">
                    <div class="server-control">
                        <button id="change-server-btn">
                            Change Server <span class="dropdown-icon">&#9660;</span>
                        </button>
                        <!-- Dropdown anchored to the button -->
                        <div id="server-dropdown" class="server-dropdown">
                            <ul id="server-list"></ul>
                        </div>
                    </div>

                    <button id="sandbox-toggle" class="sandbox-btn on">Sandbox: ON</button>
                    <button onclick="toggleFullscreen()">Fullscreen</button>
                    <button id="download-btn" class="download-btn">Download</button>
                </div>

                <!-- Video -->
                <iframe id="movie-iframe" frameborder="0" allowfullscreen 
                    referrerpolicy="no-referrer" scrolling="no" 
                    sandbox="allow-scripts allow-presentation allow-same-origin">
                </iframe>
            </div>

            <div class="movie-sidebar">
                
                <div class="poster-info-row">
                    
                    <div class="poster-container">
                        <img id="movie-poster" alt="Movie Poster" class="movie-poster" src="images/placeholder.png">
                        <button id="watch-trailer-btn">Watch Trailer</button>
                    </div>        
                    
                    <div class="movie-info-section">
                        <h1 id="movie-title">Movie Title</h1>
                        <p id="movie-description">This is the movie description...</p>
                        
                        <div class="movie-genres" id="movie-genres"></div>

                        <div class="movie-info">
                            <div class="movie-rating" id="movie-rating"></div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-buttons"></div>            
                
                <div class="cast-container">
                    <h2>Cast</h2>
                    <div class="movie-cast" id="movie-cast"></div>
                </div>    
            </div>
        </div>    
    </div>
    
    <div id="trailer-popup" class="trailer-popup">
        <div class="trailer-content">
            <span id="close-trailer" class="close-trailer">&times;</span>
            <iframe id="movie-iframe-trailer" width="854" height="480" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>        
    
    <button class="close-button" id="close-button">
        <span class="close-text">CLOSE</span>&times;
    </button>
