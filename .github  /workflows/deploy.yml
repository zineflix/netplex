name: Obfuscate and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Obfuscator Tool
        run: npm install -g javascript-obfuscator

      - name: Create Production Build
        run: |
          mkdir -p dist

          # 1. Copy all HTML files from inside Netplex/ into dist
          cp Netplex/*.html dist/ 2>/dev/null || true

          # 2. Copy css and js folders from inside Netplex/ into dist
          cp -r Netplex/css dist/ 2>/dev/null || true
          cp -r Netplex/js dist/ 2>/dev/null || true

          # If you have images, assets, or fonts, uncomment and copy them:
          # cp -r Netplex/images dist/ 2>/dev/null || true
          # cp -r Netplex/assets dist/ 2>/dev/null || true

          # 3. Obfuscate all JS files inside dist/js/
          javascript-obfuscator dist/js --output dist/js \
            --compact true \
            --control-flow-flattening true \
            --dead-code-injection true \
            --string-array true \
            --string-array-encoding 'base64' \
            --debug-protection true \
            --disable-console-output true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
